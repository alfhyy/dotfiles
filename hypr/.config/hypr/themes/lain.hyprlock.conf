background {
    monitor =
    color = rgb(0, 0, 0)
}

input-field {
    size = 220, 26
    outline_thickness = 1
    dots_size = 0.2
    dots_center = true
    outer_color = rgb(90, 90, 90)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(226, 226, 226)
    hide_input = false
    rounding = 0
    check_color = rgb(226, 226, 226)
    fail_color = rgb(255, 97, 97)
    position = 0, -40
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$TIME"
    color = rgb(226, 226, 226)
    font_size = 96
    font_family = Archivo Expanded Thin
    position = 0, 120
    halign = center
    valign = center
}

label {
    text = CLOSE THE WORLD, OPEN THE NEXT
    color = rgb(120, 120, 120)
    font_size = 11
    font_family = Departure Mono
    position = 0, 20
    halign = center
    valign = center
}
