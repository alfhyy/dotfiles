source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    color = $ink
}

input-field {
    size = 220, 26
    outline_thickness = 1
    dots_size = 0.2
    dots_center = true
    outer_color = $line
    inner_color = $ink
    font_color = $paper
    hide_input = false
    rounding = 0
    check_color = $paper
    fail_color = $danger
    position = 0, -40
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$TIME"
    color = $paper
    font_size = 96
    font_family = Archivo Expanded Thin
    position = 0, 120
    halign = center
    valign = center
}

label {
    text = CLOSE THE WORLD, OPEN THE NEXT
    color = $line
    font_size = 11
    font_family = Departure Mono
    position = 0, 20
    halign = center
    valign = center
}
