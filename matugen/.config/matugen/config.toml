[config]
# Default mode - overridden at runtime via --mode flag in toggle-theme.sh
mode = "light"

[config.custom_colors]
green = "#3f6b4a"
yellow = "#8f5f1a"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -USR1 kitty'

[templates.rofi]
input_path = '~/.config/matugen/templates/colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.config/quickshell/Theme/colors.json"
# Theme/theme.qml loads this JSON and animates to it; the IPC call makes it re-read right away
post_hook = 'qs ipc call theme reload'

[templates.gtk3]
input_path = '~/.config/matugen/templates/matugen-gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/matugen-gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.colors-zsh]
input_path = "~/.config/matugen/templates/colors.zsh"
output_path = "~/.config/matugen/colors.zsh"
[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-colors.lua'
output_path = '~/.config/nvim/colors/matugen.lua'
# nvim fires its Signal autocmd on SIGUSR1; init.lua reloads the colorscheme there
post_hook = 'pkill -USR1 -x nvim || true'
